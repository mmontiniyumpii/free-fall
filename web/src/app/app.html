<header class="topbar">
  <span class="brand">Cuatro en línea</span>
</header>

<main class="layout">
  <section class="board-area">
    <app-board
      [state]="game()"
      [disabled]="boardLocked()"
      [pendingColumn]="pendingColumn()"
      [offline]="offline()"
      (columnSelected)="play($event)"
      (columnFocused)="focusedColumn.set($event)"
      (columnRejected)="rejectedColumn.set($event)"
    />
    @if (celebrating()) {
      <app-confetti />
    }
  </section>
  <app-status
    class="status"
    [state]="game()"
    [thinking]="thinking()"
    [focusedColumn]="focusedColumn()"
    [rejectedColumn]="rejectedColumn()"
    [retryIn]="retryIn()"
    [notice]="notice()"
  />
  <app-toolbar
    class="panel"
    [mode]="toolbarMode()"
    [first]="first()"
    [busy]="busy()"
    [showKeys]="humanTurn()"
    (firstChange)="first.set($event)"
    (newGame)="newGame()"
    (backToSetup)="backToSetup()"
    (retry)="retry()"
  />
</main>
