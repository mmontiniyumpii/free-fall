<header class="topbar">
  <span class="brand">Cuatro en línea</span>
  <button type="button" class="icon-button" aria-label="Cómo se juega" title="Cómo se juega" (click)="rulesOpen.set(true)">
    <!-- Ícono info de Lucide (ISC). -->
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="10" />
      <path d="M12 16v-4" />
      <path d="M12 8h.01" />
    </svg>
  </button>
</header>

<app-rules [open]="rulesOpen()" [touch]="touch" (closed)="rulesOpen.set(false)" />

<main class="layout">
  <section class="board-area">
    <app-board
      [state]="boardState()"
      [endingEffects]="phase() !== 'replay'"
      [disabled]="boardLocked()"
      [pendingColumn]="pendingColumn()"
      [offline]="offline()"
      [touch]="touch"
      (columnSelected)="play($event)"
      (columnFocused)="focusedColumn.set($event)"
      (columnRejected)="rejectedColumn.set($event)"
    />
    @if (celebrating()) {
      <app-confetti />
    }
  </section>
  @if (phase() === 'replay') {
    <app-replay class="replay-panel" (frameChange)="replayFrame.set($event)" (exit)="closeReplay()" />
  } @else {
    <app-status
      class="status"
      [state]="game()"
      [thinking]="thinking()"
      [focusedColumn]="focusedColumn()"
      [rejectedColumn]="rejectedColumn()"
      [retryIn]="retryIn()"
      [notice]="notice()"
      [touch]="touch"
    />
    <section class="panel">
      <app-toolbar
        [mode]="toolbarMode()"
        [first]="first()"
        [difficulty]="difficulty()"
        [busy]="busy()"
        [showKeys]="humanTurn() && !touch"
        (firstChange)="first.set($event)"
        (difficultyChange)="difficulty.set($event)"
        (newGame)="newGame()"
        (backToSetup)="backToSetup()"
        (retry)="retry()"
        (openReplay)="openReplay()"
      />
      @if (phase() === 'game' && game(); as state) {
        <app-history [state]="state" />
      }
    </section>
  }
</main>
