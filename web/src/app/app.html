<header class="topbar">
  <span class="brand">Cuatro en línea</span>
</header>

<main class="layout">
  <section class="board-area">
    <app-board
      [state]="game()"
      [disabled]="busy()"
      (columnSelected)="play($event)"
      (columnFocused)="focusedColumn.set($event)"
      (columnRejected)="rejectedColumn.set($event)"
    />
  </section>
  <app-status
    class="status"
    [state]="game()"
    [thinking]="thinking()"
    [focusedColumn]="focusedColumn()"
    [rejectedColumn]="rejectedColumn()"
  />
  <app-toolbar
    class="panel"
    [mode]="toolbarMode()"
    [first]="first()"
    [busy]="busy()"
    [showKeys]="humanTurn()"
    (firstChange)="first.set($event)"
    (newGame)="newGame()"
    (backToSetup)="backToSetup()"
  />
</main>
