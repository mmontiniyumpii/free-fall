<header class="topbar">
  <span class="brand">Cuatro en línea</span>
</header>

<main class="layout">
  <section class="board-area">
    @if (game(); as state) {
      <app-board [state]="state" [disabled]="busy()" (columnSelected)="play($event)" />
    }
  </section>
  <section class="status"></section>
  <section class="panel"></section>
</main>
