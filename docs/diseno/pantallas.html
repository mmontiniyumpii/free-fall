document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

olor:#16181D;width:max-content\">\n  <header style=\"display:flex;flex-direction:column;gap:12px;max-width:900px\">\n    <h1 style=\"margin:0;font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:700;font-size:72px;line-height:1;letter-spacing:-0.01em\">Cuatro en línea<\u002Fh1>\n    <p style=\"margin:0;font-size:17px;line-height:1.55;color:#4A505C\">Tablero de 8 × 7 contra un bot. Escritorio a 1440 px y teléfono a 390 px, en modo claro y oscuro. Cada pantalla se puede jugar desde su estado.<\u002Fp>\n  <\u002Fheader>\n  \n<section id=\"notas\" style=\"display:flex;flex-direction:column;gap:40px;background:#FFFFFF;border:1px solid #D3D6DC;border-radius:16px;padding:48px;width:2118px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:baseline;gap:16px;border-bottom:1px solid #D3D6DC;padding-bottom:16px\"><h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:700;font-size:44px;letter-spacing:-0.01em;color:#16181D\">Notas de diseño<\u002Fh2><span style=\"font-size:15px;color:#4A505C\">Para implementar sin adivinar.<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:64px;border-radius:8px;background:#1A1E26;border:1px solid rgba(0,0,0,.10)\"><\u002Fdiv><div style=\"font-size:14px;font-weight:600;color:#16181D\">Grafito<\u002Fdiv><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#646B78\">#1A1E26<\u002Fdiv><div style=\"font-size:13px;line-height:1.45;color:#4A505C\">Tablero. Texto principal #16181D. En oscuro: fondo #0B0D11, panel #111419, tablero #1D222C.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:64px;border-radius:8px;background:#D23434;border:1px solid rgba(0,0,0,.10)\"><\u002Fdiv><div style=\"font-size:14px;font-weight:600;color:#16181D\">Rojo (tu color)<\u002Fdiv><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#646B78\">#D23434<\u002Fdiv><div style=\"font-size:13px;line-height:1.45;color:#4A505C\">Por defecto. Tus fichas, marcador de turno, anillos ganadores y botón principal. Texto encima en blanco (4,9:1).<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:64px;border-radius:8px;background:#5B9BFF;border:1px solid rgba(0,0,0,.10)\"><\u002Fdiv><div style=\"font-size:14px;font-weight:600;color:#16181D\">Azul bot<\u002Fdiv><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#646B78\">#5B9BFF<\u002Fdiv><div style=\"font-size:13px;line-height:1.45;color:#4A505C\">Fijo. Fichas del bot. Más claro que el rojo y de tono opuesto, además de la diferencia de forma.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:64px;border-radius:8px;background:#F2F3F5;border:1px solid rgba(0,0,0,.10)\"><\u002Fdiv><div style=\"font-size:14px;font-weight:600;color:#16181D\">Fondo<\u002Fdiv><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#646B78\">#F2F3F5<\u002Fdiv><div style=\"font-size:13px;line-height:1.45;color:#4A505C\">Zona del tablero. Panel y barra en #FFFFFF. Líneas #E1E3E8.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:64px;border-radius:8px;background:#4A505C;border:1px solid rgba(0,0,0,.10)\"><\u002Fdiv><div style=\"font-size:14px;font-weight:600;color:#16181D\">Texto secundario<\u002Fdiv><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#646B78\">#4A505C<\u002Fdiv><div style=\"font-size:13px;line-height:1.45;color:#4A505C\">Detalle de estado. Terciario #646B78 para eyebrows y números.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:64px;border-radius:8px;background:#A85A00;border:1px solid rgba(0,0,0,.10)\"><\u002Fdiv><div style=\"font-size:14px;font-weight:600;color:#16181D\">Aviso<\u002Fdiv><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#646B78\">#A85A00<\u002Fdiv><div style=\"font-size:13px;line-height:1.45;color:#4A505C\">Columna llena y sin conexión. #F5A524 en oscuro. Ámbar, para no confundirse con ningún color de ficha.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:12px\">\n    <h3 style=\"margin:0;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.075em;text-transform:uppercase;color:#646B78;font-weight:500\">Tu color · se elige en la pantalla de inicio<\u002Fh3>\n    <div style=\"display:flex;gap:32px;flex-wrap:wrap\"><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:20px;height:20px;border-radius:50%;background:#D23434;box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)\"><\u002Fspan><span style=\"font-size:13px;color:#16181D\">Rojo<\u002Fspan><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#646B78\">#D23434<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:20px;height:20px;border-radius:50%;background:#F26B1D;box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)\"><\u002Fspan><span style=\"font-size:13px;color:#16181D\">Naranja<\u002Fspan><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#646B78\">#F26B1D<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:20px;height:20px;border-radius:50%;background:#F2B807;box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)\"><\u002Fspan><span style=\"font-size:13px;color:#16181D\">Amarillo<\u002Fspan><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#646B78\">#F2B807<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:20px;height:20px;border-radius:50%;background:#1F9D63;box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)\"><\u002Fspan><span style=\"font-size:13px;color:#16181D\">Verde<\u002Fspan><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#646B78\">#1F9D63<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:20px;height:20px;border-radius:50%;background:#E0428A;box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)\"><\u002Fspan><span style=\"font-size:13px;color:#16181D\">Rosa<\u002Fspan><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#646B78\">#E0428A<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <p style=\"margin:0;font-size:15px;line-height:1.6;color:#22262E;max-width:900px\">El color elegido reemplaza al acento en toda la interfaz: fichas, turno, línea ganadora y botón principal. El texto sobre el acento es blanco en rojo y grafito en los demás, para mantener 4,5:1. El azul queda reservado para el bot, por eso no está entre las opciones.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\"><h3 style=\"margin:0;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.075em;text-transform:uppercase;color:#646B78;font-weight:500\">Fichas<\u002Fh3><p style=\"margin:0;font-size:15px;line-height:1.6;color:#22262E;text-wrap:pretty\"><b>Vos:<\u002Fb> disco lleno en tu color (rojo por defecto). <b>Bot:<\u002Fb> disco azul con el centro hueco. Se distinguen por forma, por luminancia y por tono cálido contra frío, así que se leen con cualquier tipo de daltonismo y en escala de grises, elijas el color que elijas.<\u002Fp><p style=\"margin:0;font-size:15px;line-height:1.6;color:#22262E;text-wrap:pretty\">Estados de ficha: normal, fantasma (contorno punteado en tu color en la casilla donde caería), ganadora (anillo de 3 px en tu color separado por 2 px de aire) y atenuada (30 %).<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\"><h3 style=\"margin:0;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.075em;text-transform:uppercase;color:#646B78;font-weight:500\">Tipografía<\u002Fh3><p style=\"margin:0;font-size:15px;line-height:1.6;color:#22262E;text-wrap:pretty\"><b>Archivo<\u002Fb> al 75 % de ancho, 700, para el título de estado y el nombre en la barra (80 %). Es la voz del juego: “Tu turno”, “Ganaste”, “Empate”.<\u002Fp><p style=\"margin:0;font-size:15px;line-height:1.6;color:#22262E;text-wrap:pretty\"><b>Geist<\u002Fb> 400–600 para interfaz. <b>Geist Mono<\u002Fb> para números de columna, jugadas y eyebrows.<\u002Fp><p style=\"margin:0;font-size:15px;line-height:1.6;color:#22262E;text-wrap:pretty\">Escala: título 36 / 28 (teléfono) · detalle 14 / 13 · UI 13 · label 12 · eyebrow 11 en mayúsculas con +0.075em.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\"><h3 style=\"margin:0;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.075em;text-transform:uppercase;color:#646B78;font-weight:500\">Grilla y medidas<\u002Fh3><p style=\"margin:0;font-size:15px;line-height:1.6;color:#22262E;text-wrap:pretty\">Base de 4 px: 4, 8, 12, 16, 24, 32. Radios: 8 controles, 10 opciones, 12–16 tablero.<\u002Fp><p style=\"margin:0;font-size:15px;line-height:1.6;color:#22262E;text-wrap:pretty\"><b>Escritorio:<\u002Fb> barra 56, panel fijo 380 a la derecha, tablero centrado con celda de 80 (ficha 64) y carril de previsualización de 72.<\u002Fp><p style=\"margin:0;font-size:15px;line-height:1.6;color:#22262E;text-wrap:pretty\"><b>Teléfono:<\u002Fb> barra 52, celda de 45, tablero de 372 px de ancho sin scroll horizontal. La zona táctil es la columna entera (45 × 360 px), carril incluido.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\"><h3 style=\"margin:0;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.075em;text-transform:uppercase;color:#646B78;font-weight:500\">Componentes<\u002Fh3><p style=\"margin:0;font-size:15px;line-height:1.6;color:#22262E;text-wrap:pretty\">Tablero (columna = zona de toque, carril superior, etiquetas 1–8) · Ficha · Indicador de turno (segmentado con marcador deslizante) · Bloque de estado (eyebrow, título, detalle) · Acciones · Historial · Selector de inicio y dificultad.<\u002Fp><p style=\"margin:0;font-size:15px;line-height:1.6;color:#22262E;text-wrap:pretty\">Componentes base de Compass: Button, IconButton, Icon (Lucide 1.6 px). El botón principal en tu color es propio y hay uno solo por pantalla.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px;border-top:1px solid #E1E3E8;padding-top:32px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\"><h3 style=\"margin:0;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.075em;text-transform:uppercase;color:#646B78;font-weight:500\">Caída de la ficha<\u002Fh3><p style=\"margin:0;font-size:15px;line-height:1.6;color:#22262E;text-wrap:pretty\">220 ms + 22 ms por fila (máx. 352 ms). Cae acelerando hasta el 72 % del tiempo, rebota 6 % de su altura y asienta. Arranca desde el carril, así la ficha que previsualizaste es la que cae.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\"><h3 style=\"margin:0;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.075em;text-transform:uppercase;color:#646B78;font-weight:500\">Línea ganadora<\u002Fh3><p style=\"margin:0;font-size:15px;line-height:1.6;color:#22262E;text-wrap:pretty\">Al terminar la caída: las fichas que no ganan bajan a 30 % en 320 ms. Los anillos aparecen uno por uno, cada 110 ms, en el orden de la línea. A los 760 ms un trazo blanco une los centros en 380 ms. Todo termina antes de 1,2 s.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\"><h3 style=\"margin:0;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.075em;text-transform:uppercase;color:#646B78;font-weight:500\">Turno y bot<\u002Fh3><p style=\"margin:0;font-size:15px;line-height:1.6;color:#22262E;text-wrap:pretty\">El marcador del indicador se desliza 180 ms con cubic-bezier(.2,0,.2,1). Mientras el bot piensa (0,5–1,7 s, nunca más de 2), su ficha azul recorre el carril de lado a lado y tres puntos laten junto al título.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\"><h3 style=\"margin:0;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.075em;text-transform:uppercase;color:#646B78;font-weight:500\">Interacción<\u002Fh3><p style=\"margin:0;font-size:15px;line-height:1.6;color:#22262E;text-wrap:pretty\">Escritorio: hover previsualiza, clic suelta, teclas 1 a 8. Teléfono: el primer toque previsualiza, el segundo en la misma columna suelta. Deshacer vuelve a tu última jugada. Con prefers-reduced-motion todas las duraciones pasan a 1 ms.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n  <section style=\"display:flex;flex-direction:column;gap:64px\">\n    <div style=\"display:flex;align-items:baseline;gap:16px;border-bottom:1px solid #D3D6DC;padding-bottom:16px\"><h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:700;font-size:44px;letter-spacing:-0.01em;color:#16181D\">Modo claro<\u002Fh2><span style=\"font-size:15px;color:#4A505C\">Ocho estados, escritorio y teléfono.<\u002Fspan><\u002Fdiv>\n    \n  <div id=\"light-setup\" style=\"display:grid;grid-template-columns:240px 1440px 390px;gap:48px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:4px\">\n      <span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#646B78\">01<\u002Fspan>\n      <span style=\"font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:700;font-size:32px;line-height:1.05;color:#16181D\">Inicio<\u002Fspan>\n      <p style=\"margin:0;font-size:14px;line-height:1.5;color:#4A505C;text-wrap:pretty\">Elegís quién abre y la dificultad. El tablero vacío ya está en su lugar definitivo.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"width:1440px;height:900px;border:1px solid #D3D6DC;border-radius:12px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"desktop\" scenario=\"setup\" theme=\"light\" frozen=\"{{ true }}\" hint-size=\"1440px,900px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div style=\"width:390px;height:844px;border:1px solid #D3D6DC;border-radius:24px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"mobile\" scenario=\"setup\" theme=\"light\" frozen=\"{{ true }}\" hint-size=\"390px,844px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"light-turn\" style=\"display:grid;grid-template-columns:240px 1440px 390px;gap:48px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:4px\">\n      <span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#646B78\">02<\u002Fspan>\n      <span style=\"font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:700;font-size:32px;line-height:1.05;color:#16181D\">Tu turno<\u002Fspan>\n      <p style=\"margin:0;font-size:14px;line-height:1.5;color:#4A505C;text-wrap:pretty\">Hover (escritorio) o primer toque (teléfono) muestra la ficha en el carril y el contorno donde cae.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"width:1440px;height:900px;border:1px solid #D3D6DC;border-radius:12px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"desktop\" scenario=\"turn\" theme=\"light\" frozen=\"{{ true }}\" hint-size=\"1440px,900px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div style=\"width:390px;height:844px;border:1px solid #D3D6DC;border-radius:24px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"mobile\" scenario=\"turn\" theme=\"light\" frozen=\"{{ true }}\" hint-size=\"390px,844px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"light-invalid\" style=\"display:grid;grid-template-columns:240px 1440px 390px;gap:48px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:4px\">\n      <span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#646B78\">02b<\u002Fspan>\n      <span style=\"font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:700;font-size:32px;line-height:1.05;color:#16181D\">Jugada inválida<\u002Fspan>\n      <p style=\"margin:0;font-size:14px;line-height:1.5;color:#4A505C;text-wrap:pretty\">Columna llena: el carril dice “Llena”, la columna tiembla 300 ms y el detalle lo explica.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"width:1440px;height:900px;border:1px solid #D3D6DC;border-radius:12px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"desktop\" scenario=\"invalid\" theme=\"light\" frozen=\"{{ true }}\" hint-size=\"1440px,900px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div style=\"width:390px;height:844px;border:1px solid #D3D6DC;border-radius:24px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"mobile\" scenario=\"invalid\" theme=\"light\" frozen=\"{{ true }}\" hint-size=\"390px,844px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"light-thinking\" style=\"display:grid;grid-template-columns:240px 1440px 390px;gap:48px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:4px\">\n      <span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#646B78\">03<\u002Fspan>\n      <span style=\"font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:700;font-size:32px;line-height:1.05;color:#16181D\">Bot pensando<\u002Fspan>\n      <p style=\"margin:0;font-size:14px;line-height:1.5;color:#4A505C;text-wrap:pretty\">Tablero bloqueado. La ficha del bot recorre el carril y los puntos laten: la app sigue viva.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"width:1440px;height:900px;border:1px solid #D3D6DC;border-radius:12px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"desktop\" scenario=\"thinking\" theme=\"light\" frozen=\"{{ true }}\" hint-size=\"1440px,900px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div style=\"width:390px;height:844px;border:1px solid #D3D6DC;border-radius:24px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"mobile\" scenario=\"thinking\" theme=\"light\" frozen=\"{{ true }}\" hint-size=\"390px,844px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"light-win\" style=\"display:grid;grid-template-columns:240px 1440px 390px;gap:48px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:4px\">\n      <span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#646B78\">04<\u002Fspan>\n      <span style=\"font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:700;font-size:32px;line-height:1.05;color:#16181D\">Ganaste<\u002Fspan>\n      <p style=\"margin:0;font-size:14px;line-height:1.5;color:#4A505C;text-wrap:pretty\">Las fichas que no ganan se atenúan, los anillos aparecen en orden y un trazo une la línea.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"width:1440px;height:900px;border:1px solid #D3D6DC;border-radius:12px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"desktop\" scenario=\"win\" theme=\"light\" frozen=\"{{ true }}\" hint-size=\"1440px,900px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div style=\"width:390px;height:844px;border:1px solid #D3D6DC;border-radius:24px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"mobile\" scenario=\"win\" theme=\"light\" frozen=\"{{ true }}\" hint-size=\"390px,844px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"light-lose\" style=\"display:grid;grid-template-columns:240px 1440px 390px;gap:48px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:4px\">\n      <span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#646B78\">05<\u002Fspan>\n      <span style=\"font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:700;font-size:32px;line-height:1.05;color:#16181D\">Ganó el bot<\u002Fspan>\n      <p style=\"margin:0;font-size:14px;line-height:1.5;color:#4A505C;text-wrap:pretty\">Mismo tratamiento sobre las fichas del bot. El tablero queda visible.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"width:1440px;height:900px;border:1px solid #D3D6DC;border-radius:12px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"desktop\" scenario=\"lose\" theme=\"light\" frozen=\"{{ true }}\" hint-size=\"1440px,900px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div style=\"width:390px;height:844px;border:1px solid #D3D6DC;border-radius:24px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"mobile\" scenario=\"lose\" theme=\"light\" frozen=\"{{ true }}\" hint-size=\"390px,844px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"light-draw\" style=\"display:grid;grid-template-columns:240px 1440px 390px;gap:48px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:4px\">\n      <span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#646B78\">06<\u002Fspan>\n      <span style=\"font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:700;font-size:32px;line-height:1.05;color:#16181D\">Empate<\u002Fspan>\n      <p style=\"margin:0;font-size:14px;line-height:1.5;color:#4A505C;text-wrap:pretty\">56 casillas llenas. Sin resaltado; el resultado va en el bloque de estado.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"width:1440px;height:900px;border:1px solid #D3D6DC;border-radius:12px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"desktop\" scenario=\"draw\" theme=\"light\" frozen=\"{{ true }}\" hint-size=\"1440px,900px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div style=\"width:390px;height:844px;border:1px solid #D3D6DC;border-radius:24px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"mobile\" scenario=\"draw\" theme=\"light\" frozen=\"{{ true }}\" hint-size=\"390px,844px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"light-error\" style=\"display:grid;grid-template-columns:240px 1440px 390px;gap:48px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:4px\">\n      <span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#646B78\">07<\u002Fspan>\n      <span style=\"font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:700;font-size:32px;line-height:1.05;color:#16181D\">Sin conexión<\u002Fspan>\n      <p style=\"margin:0;font-size:14px;line-height:1.5;color:#4A505C;text-wrap:pretty\">Tablero al 50 %, aviso en el carril, reintento automático y manual. La partida se conserva.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"width:1440px;height:900px;border:1px solid #D3D6DC;border-radius:12px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"desktop\" scenario=\"error\" theme=\"light\" frozen=\"{{ true }}\" hint-size=\"1440px,900px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div style=\"width:390px;height:844px;border:1px solid #D3D6DC;border-radius:24px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"mobile\" scenario=\"error\" theme=\"light\" frozen=\"{{ true }}\" hint-size=\"390px,844px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"display:flex;flex-direction:column;gap:64px\">\n    <div style=\"display:flex;align-items:baseline;gap:16px;border-bottom:1px solid #D3D6DC;padding-bottom:16px\"><h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:700;font-size:44px;letter-spacing:-0.01em;color:#16181D\">Modo oscuro<\u002Fh2><span style=\"font-size:15px;color:#4A505C\">Mismos componentes. El tablero se aclara un paso para separarse del fondo.<\u002Fspan><\u002Fdiv>\n    \n  <div id=\"dark-turn\" style=\"display:grid;grid-template-columns:240px 1440px 390px;gap:48px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:4px\">\n      <span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#646B78\">02<\u002Fspan>\n      <span style=\"font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:700;font-size:32px;line-height:1.05;color:#16181D\">Tu turno<\u002Fspan>\n      \n    <\u002Fdiv>\n    <div style=\"width:1440px;height:900px;border:1px solid #D3D6DC;border-radius:12px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"desktop\" scenario=\"turn\" theme=\"dark\" frozen=\"{{ true }}\" hint-size=\"1440px,900px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div style=\"width:390px;height:844px;border:1px solid #D3D6DC;border-radius:24px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"mobile\" scenario=\"turn\" theme=\"dark\" frozen=\"{{ true }}\" hint-size=\"390px,844px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"dark-thinking\" style=\"display:grid;grid-template-columns:240px 1440px 390px;gap:48px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:4px\">\n      <span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#646B78\">03<\u002Fspan>\n      <span style=\"font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:700;font-size:32px;line-height:1.05;color:#16181D\">Bot pensando<\u002Fspan>\n      \n    <\u002Fdiv>\n    <div style=\"width:1440px;height:900px;border:1px solid #D3D6DC;border-radius:12px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"desktop\" scenario=\"thinking\" theme=\"dark\" frozen=\"{{ true }}\" hint-size=\"1440px,900px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div style=\"width:390px;height:844px;border:1px solid #D3D6DC;border-radius:24px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"mobile\" scenario=\"thinking\" theme=\"dark\" frozen=\"{{ true }}\" hint-size=\"390px,844px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"dark-win\" style=\"display:grid;grid-template-columns:240px 1440px 390px;gap:48px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:4px\">\n      <span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#646B78\">04<\u002Fspan>\n      <span style=\"font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:700;font-size:32px;line-height:1.05;color:#16181D\">Ganaste<\u002Fspan>\n      \n    <\u002Fdiv>\n    <div style=\"width:1440px;height:900px;border:1px solid #D3D6DC;border-radius:12px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"desktop\" scenario=\"win\" theme=\"dark\" frozen=\"{{ true }}\" hint-size=\"1440px,900px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div style=\"width:390px;height:844px;border:1px solid #D3D6DC;border-radius:24px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"mobile\" scenario=\"win\" theme=\"dark\" frozen=\"{{ true }}\" hint-size=\"390px,844px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"dark-error\" style=\"display:grid;grid-template-columns:240px 1440px 390px;gap:48px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:4px\">\n      <span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#646B78\">07<\u002Fspan>\n      <span style=\"font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:700;font-size:32px;line-height:1.05;color:#16181D\">Sin conexión<\u002Fspan>\n      \n    <\u002Fdiv>\n    <div style=\"width:1440px;height:900px;border:1px solid #D3D6DC;border-radius:12px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"desktop\" scenario=\"error\" theme=\"dark\" frozen=\"{{ true }}\" hint-size=\"1440px,900px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n    <div style=\"width:390px;height:844px;border:1px solid #D3D6DC;border-radius:24px;overflow:hidden;background:#fff\">\n      <dc-import name=\"Juego\" layout=\"mobile\" scenario=\"error\" theme=\"dark\" frozen=\"{{ true }}\" hint-size=\"390px,844px\" style=\"width:100%;height:100%\"><\u002Fdc-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
